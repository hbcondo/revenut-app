<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>

  <!-- GitHub-like markdown styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <style>
    body { background: #f6f8fa; color: #24292e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    main.markdown-body { box-sizing: border-box; max-width: 980px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(27,31,35,0.04); }
    .markdown-body img { max-width: 100%; }
    .markdown-body h1, .markdown-body h2 { margin-top: 0.5rem; }
  </style>

  {{ content_for_head }}
</head>
<body>
  <main class="markdown-body">
    {{ content }}
  </main>

  <script type="module">
    // Convert Jekyll's fenced mermaid code blocks into div.mermaid
    document.querySelectorAll('code').forEach(c=>{
      if((c.className||'').split(/\s+/).some(x=>/language-mermaid/i.test(x))){
        const pre=c.closest('pre');
        const d=document.createElement('div');
        d.className='mermaid';
        d.textContent=c.textContent||'';
        if(pre && pre.parentNode) pre.parentNode.replaceChild(d,pre);
        else if(c.parentNode) c.parentNode.replaceChild(d,c);
      }
    });

    // Import official mermaid ESM and initialize
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>
</body>
</html>
